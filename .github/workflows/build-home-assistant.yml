# Compile l'APK « Toque + domotique » sur la branche home-assistant, sans rien publier :
# l'APK est à télécharger dans l'onglet Actions (artefact), puis à installer à la main par adb.
name: Build APK (home-assistant)

on:
  push:
    branches: [home-assistant]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tests and build (Connect)
        run: ./gradlew --no-daemon :core:test :app:assembleRelease
      - name: Checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk Toque-ha.apk
          sha256sum Toque-ha.apk | tee Toque-ha.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Toque-ha
          path: |
            Toque-ha.apk
            Toque-ha.apk.sha256
